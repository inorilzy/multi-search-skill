[package]
name = "multi-search-desktop"
version = "0.1.0"
edition = "2021"

autotests = false

[lib]
name = "multi_search_desktop"
path = "src/lib.rs"

[[test]]
name = "diagnostics"
path = "tests/diagnostics.rs"

[[test]]
name = "execution"
path = "tests/execution.rs"

[[test]]
name = "install"
path = "tests/install.rs"
required-features = ["install-test-boundary"]

[[test]]
name = "install_lifecycle"
path = "tests/install_lifecycle.rs"
required-features = ["install-test-boundary"]

[[test]]
name = "install_release_boundary"
path = "tests/install_release_boundary.rs"

[[test]]
name = "installed_cli"
path = "tests/installed_cli.rs"

[[test]]
name = "skill"
path = "tests/skill.rs"

[[test]]
name = "skill_manage"
path = "tests/skill_manage.rs"

[[test]]
name = "credentials"
path = "tests/credentials.rs"

[[test]]
name = "credential_sources"
path = "tests/credential_sources.rs"

[[test]]
name = "settings"
path = "tests/settings.rs"

[[test]]
name = "provider_parity"
path = "tests/provider_parity.rs"

[[test]]
name = "process_env"
path = "tests/process_env.rs"

[[test]]
name = "sqlite_credentials"
path = "tests/sqlite_credentials.rs"

[[test]]
name = "ui_contract"
path = "tests/ui_contract.rs"

[[bin]]
name = "multi-search-desktop"
path = "src/main.rs"
required-features = ["native-window"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
# ts-rs exports TypeScript declarations for the UI command contract. The
# derive is unconditional so payload structs stay consistent; codegen runs in
# `cargo test export_ui_contract` and is not part of the runtime binary.
ts-rs = { version = "12", features = ["serde-json-impl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["native-window"]
native-window = ["dep:tauri", "dep:tauri-build"]
# Test-only boundary: enables env-driven install source/anchor overrides and the disposable user PATH.
# Never packageable for release; the default and release builds ignore these environment keys.
install-test-boundary = []

[dependencies.tauri]
version = "2"
optional = true
features = []

[build-dependencies.tauri-build]
version = "2"
optional = true
features = []
