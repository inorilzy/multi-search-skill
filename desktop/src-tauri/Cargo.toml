[package]
name = "multi-search-desktop"
version = "0.1.0"
edition = "2021"

autotests = false

[lib]
name = "multi_search_desktop"
path = "src/lib.rs"

[[test]]
name = "diagnostics"
path = "tests/diagnostics.rs"

[[test]]
name = "execution"
path = "tests/execution.rs"

[[test]]
name = "install"
path = "tests/install.rs"
required-features = ["install-test-boundary"]

[[test]]
name = "install_lifecycle"
path = "tests/install_lifecycle.rs"
required-features = ["install-test-boundary"]

[[test]]
name = "install_release_boundary"
path = "tests/install_release_boundary.rs"

[[test]]
name = "installed_cli"
path = "tests/installed_cli.rs"

[[test]]
name = "skill"
path = "tests/skill.rs"

[[test]]
name = "skill_manage"
path = "tests/skill_manage.rs"

[[test]]
name = "credentials"
path = "tests/credentials.rs"
required-features = ["test-fixtures"]

[[test]]
name = "credential_sources"
path = "tests/credential_sources.rs"
required-features = ["test-fixtures"]

[[test]]
name = "settings"
path = "tests/settings.rs"
required-features = ["test-fixtures"]

[[test]]
name = "source_catalog"
path = "tests/source_catalog.rs"

[[bin]]
name = "multi-search-desktop"
path = "src/main.rs"
required-features = ["native-window"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["native-window"]
native-window = ["dep:tauri", "dep:tauri-build"]
# Test-only boundary: enables env-driven install source/anchor overrides and the disposable user PATH.
# Never packageable for release; the default and release builds ignore these environment keys.
install-test-boundary = []
# Test-only seams (Tavily-centred credential fixture, settings writer). Never packageable:
# build.rs rejects it in release builds; the tests that use it declare it as a required feature.
test-fixtures = []

[dependencies.tauri]
version = "2"
optional = true
features = []

[build-dependencies.tauri-build]
version = "2"
optional = true
features = []
