name: Tests and installation

on:
  push:
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the trailing comment names the release);
# tests/test_ci_workflow.py rejects any `uses:` that is not pinned this way.
jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Lowest supported (pyproject requires-python) and newest supported release.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install without the development lock or editable mode
        run: python -m pip install .
      - name: Verify installed MCP-free CLI outside the repository
        run: python scripts/smoke_install.py
      - name: Run regression tests with disposable state
        run: python scripts/run_tests.py
      - name: Run scripts tests (bundle build, manifest, locked inputs, signing)
        # Discovery picks up every scripts/test_*.py, so new release-tooling tests run too.
        run: python -m unittest discover -s scripts -t scripts -p "test_*.py" -v
      - name: Check documentation source paths and local links
        run: python scripts/check_glossary_paths.py

  locked-regression:
    name: Locked regression, Python ${{ matrix.python }} on ${{ matrix.os }}
    # Same suite against the committed uv.lock instead of a fresh resolve, so a lock that
    # drifts from pyproject.toml (or a locked dependency that breaks the suite) fails CI.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - name: Sync the committed dependency lock
        run: uv sync --locked
      - name: Run locked regression tests with disposable state
        run: uv run --locked python scripts/run_tests.py
      - name: Check documentation source paths and local links
        run: uv run --locked python scripts/check_glossary_paths.py

  desktop-js:
    name: Desktop JS tests and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # happy-dom (the DOM test dependency) requires Node 20 or newer.
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked dev dependencies (happy-dom, TypeScript, Tauri CLI)
        run: npm ci
      - name: Run DOM and UI logic tests
        run: npm test
      - name: Check UI types against the generated Rust contract
        run: npm run typecheck

  desktop-rust:
    name: Desktop Rust tests
    # The desktop app targets Windows: credential store, DPAPI, Job Objects, user PATH and the
    # pinned x86_64-pc-windows-msvc toolchain (rust-toolchain.toml) only exist there.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MANIFEST: desktop/src-tauri/Cargo.toml
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies for the Rust interop tests
        # Interop tests run `python` against the shared Core; put the locked venv on PATH.
        run: |
          uv sync --locked --python 3.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install the pinned Rust toolchain and fetch locked crates before isolation
        # rust_ci_matrix.py swaps HOME/USERPROFILE for a disposable profile and builds --offline,
        # so pin rustup/cargo homes to the real profile and prefetch every locked crate first.
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain
          "RUSTUP_HOME=$env:USERPROFILE\.rustup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_HOME=$env:USERPROFILE\.cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cargo fetch --locked --manifest-path ${{ env.MANIFEST }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native Windows prerequisites
        run: |
          # windows-latest supplies MSVC and WebView2; fail rather than pretend native coverage.
          $edge = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue
          if (-not $edge) { throw 'Windows Rust native tests require the WebView2 runtime' }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release installation boundary ignores test selectors
        run: cargo test --locked --manifest-path ${{ env.MANIFEST }} --no-default-features --test install_release_boundary
      - name: Native tests with the test-only fixture seams and generated UI types
        # --no-default-features skips the Tauri window; test-fixtures enables the credential and
        # settings seams, ts enables the ts-rs UI contract (ui_contract requires both).
        run: cargo test --locked --manifest-path ${{ env.MANIFEST }} --no-default-features --features test-fixtures,ts
      - name: Install acceptance-boundary tests
        # install and install_lifecycle need install-test-boundary; install_release_boundary
        # (run above) asserts the opposite, so the two feature sets are built separately.
        run: >
          cargo test --locked --manifest-path ${{ env.MANIFEST }} --no-default-features
          --features test-fixtures,install-test-boundary --test install --test install_lifecycle --test install_platform
      - name: Rust interop matrix with disposable profile and explicit native overlay
        # No --ignored: real installed CLI/bundle and type generation are separate acceptance.
        # The tauri.check.conf.json overlay disables bundle inputs only; it is not a release or
        # bundle certification. The script derives the repo root itself (no cwd/PYTHONPATH).
        run: python -B scripts/rust_ci_matrix.py

  desktop-macos:
    name: Desktop macOS installation and contracts
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MANIFEST: desktop/src-tauri/Cargo.toml
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies for interop
        run: |
          uv sync --locked --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Prepare the pinned native Rust compiler
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo fetch --locked --manifest-path "$MANIFEST"
      - name: Release installation boundary ignores test selectors
        run: cargo test --locked --manifest-path "$MANIFEST" --no-default-features --test install_release_boundary
      - name: Native domain tests and generated UI contract
        run: cargo test --locked --manifest-path "$MANIFEST" --no-default-features --features test-fixtures,ts
      - name: macOS install update rollback and uninstall
        # Explicitly selected: this crate disables automatic test discovery.
        # Uses disposable homes and fixture binaries. install_real_bundle is
        # selected so it must compile; its real-bundle case is #[ignore]d and
        # runs in the release acceptance, not here.
        run: >
          cargo test --locked --manifest-path "$MANIFEST" --no-default-features
          --features test-fixtures,install-test-boundary --test install_platform --test install_real_bundle --test install_production_path
