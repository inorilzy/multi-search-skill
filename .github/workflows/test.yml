name: Tests and installation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install without the development lock or editable mode
        run: python -m pip install .
      - name: Verify installed MCP-free CLI outside the repository
        run: python scripts/smoke_install.py
      - name: Run regression tests with disposable state
        run: python scripts/run_tests.py
      - name: Run release tooling tests (bundle manifest, locked inputs, signing)
        working-directory: scripts
        run: python -m unittest test_bundle_manifest test_build_cli_bundle test_build_inputs
