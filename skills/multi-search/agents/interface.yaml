interface:
  display_name: "Multi-Search"
  short_description: "Find web sources through a lightweight explore subagent"
  default_prompt: "Use $multi-search to find online content through a lightweight explore subagent, judge its verbatim excerpts, and spot-check key claims."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["codex", "pi", "claude-code"]
  activation:
    mode: "semantic"
  execution:
    context: "inline"
    # No hardcoded shell: the CLI and CI run cross-platform, so the host picks
    # the shell and the Skill's quoting rules apply on POSIX and PowerShell.
    shell: "host-default"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "treat-as-untrusted-data"
  degradation:
    codex: "SKILL.md is the entrypoint; delegation requires a usable host subagent and model."
    pi: "SKILL.md is the entrypoint; delegation requires an installed host subagent extension and model."
    claude-code: "SKILL.md is the entrypoint; delegation uses the built-in Explore (or general-purpose) subagent with an explicitly available lightweight model."
